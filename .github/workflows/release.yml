name: release-pilot
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-openhands-pilot
          path: verified
      - name: Verify version and publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [string](Get-Content csweet-plugin.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and manifest versions differ.' }
          if (-not (Test-Path "releases/$version.md")) { throw 'Matching release notes are required.' }
          $assets = @(Get-ChildItem verified -File -Recurse | ForEach-Object FullName)
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This release already exists; published assets are immutable.' }
          gh release create "v$version" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "OpenHands Developer $version" --notes-file "releases/$version.md" @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
